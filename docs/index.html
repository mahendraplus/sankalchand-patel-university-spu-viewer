<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SPU Student Directory</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --secondary: #10b981;
      --whatsapp: #25D366;
      --dark: #0f172a;
      --darker: #020617;
      --light: #f8fafc;
      --gray: #94a3b8;
      --card-bg: #1e293b;
      --card-hover: #334155;
    }
    
    * { 
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--darker);
      color: var(--light);
      line-height: 1.6;
      padding: 0;
      min-height: 100vh;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    header {
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
    }
    
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    
    .creator {
      color: var(--gray);
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    
    .search-container {
      position: relative;
      max-width: 600px;
      margin: 0 auto 2rem;
    }
    
    #search {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      background: var(--dark);
      color: var(--light);
      border: 2px solid var(--card-bg);
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    #search:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
    }
    
    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
    }
    
    .student-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .student-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .student-card:hover {
      transform: translateY(-5px);
      background: var(--card-hover);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    
    .student-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }
    
    .student-content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    .student-pic-wrapper {
      width: 100%;
      height: 0;
      padding-bottom: 128.57%;
      background: var(--dark);
      margin: 0 auto 1.5rem;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      position: relative;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .student-pic-wrapper:hover {
      transform: scale(1.02);
    }
    
    .student-pic {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    
    .no-photo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray);
      font-size: 2rem;
      background: var(--dark);
    }
    
    .student-name {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--light);
    }
    
    .student-phone {
      color: var(--gray);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .student-info {
      margin-bottom: 1.5rem;
    }
    
    .student-info p {
      margin: 0.5rem 0;
      font-size: 0.95rem;
      display: flex;
    }
    
    .student-info strong {
      color: var(--gray);
      min-width: 120px;
      display: inline-block;
      font-weight: 500;
    }
    
    .student-info span {
      flex: 1;
    }
    
    .student-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: auto;
    }
    
    .student-buttons a,
    .student-buttons button {
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    
    .student-buttons a {
      background: var(--primary);
      color: white;
    }
    
    .student-buttons a:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }
    
    .whatsapp-btn {
      background: var(--whatsapp) !important;
    }
    
    .show-more {
      background: transparent;
      color: var(--gray);
      border: 1px solid var(--gray);
    }
    
    .show-more:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--light);
    }
    
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }
    
    .pagination button {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--light);
      border: 1px solid var(--gray);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .pagination button:hover:not(:disabled) {
      background: var(--primary);
      border-color: var(--primary);
    }
    
    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .page-numbers {
      display: flex;
      gap: 0.5rem;
    }
    
    .page-numbers button {
      min-width: 40px;
    }
    
    .page-numbers button.active {
      background: var(--primary);
      border-color: var(--primary);
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .modal.active {
      display: flex;
      opacity: 1;
    }
    
    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      max-width: 800px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      animation: modalFadeIn 0.3s ease;
    }
    
    @keyframes modalFadeIn {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .close-modal {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: transparent;
      border: none;
      color: var(--gray);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    
    .close-modal:hover {
      color: var(--light);
    }
    
    .modal-photo-container {
      width: 100%;
      height: 0;
      padding-bottom: 128.57%;
      position: relative;
      margin-bottom: 1.5rem;
      background: var(--dark);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
    }
    
    .modal-photo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    
    .modal-info {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
    }
    
    .modal-info p {
      margin: 0.5rem 0;
      font-size: 0.95rem;
    }
    
    .modal-info strong {
      color: var(--gray);
      display: block;
      font-weight: 500;
      margin-bottom: 0.2rem;
    }
    
    .loading {
      display: flex;
      justify-content: center;
      padding: 2rem;
      grid-column: 1 / -1;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--gray);
    }
    
    .empty-state i {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
    
    /* Lock System Styles */
    .lock-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--darker);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .lock-title {
      font-size: 1.8rem;
      margin-bottom: 2rem;
      color: var(--light);
      text-align: center;
    }
    
    .pin-display {
      width: 200px;
      height: 60px;
      margin-bottom: 1.5rem;
      background: var(--dark);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      letter-spacing: 0.5rem;
      padding-left: 0.5rem;
      color: var(--light);
      border: 2px solid var(--card-bg);
      font-family: monospace;
    }
    
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
      width: 250px;
    }
    
    .keypad button {
      padding: 1rem;
      font-size: 1.5rem;
      background: var(--card-bg);
      color: var(--light);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
    }
    
    .keypad button:hover {
      background: var(--primary);
      transform: scale(1.05);
    }
    
    .keypad button:active {
      transform: scale(0.95);
    }
    
    .keypad button.clear {
      grid-column: span 1;
      background: #ef4444;
      font-size: 0.8rem;
    }
    
    .keypad button.clear:hover {
      background: #dc2626;
    }
    
    .keypad button.enter {
      background: var(--secondary);
      font-size: 0.8rem;
      grid-column: span 1;
    }
    
    .keypad button.enter:hover {
      background: #0d9488;
    }
    
    .error-message {
      color: #ef4444;
      margin-top: 1.5rem;
      height: 1.5rem;
      font-size: 1rem;
      font-weight: 500;
    }
    
    /* Data Decryption Modal */
    .decrypt-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 2000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--light);
    }
    
    .decrypt-content {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    
    .decrypt-modal h3 {
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }
    
    .decrypt-input {
      padding: 0.8rem 1rem;
      width: 100%;
      margin-bottom: 1.5rem;
      background: var(--dark);
      color: var(--light);
      border: 2px solid var(--card-bg);
      border-radius: 8px;
      font-size: 1rem;
    }
    
    .decrypt-btn {
      padding: 0.8rem 1.5rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }
    
    .decrypt-btn:hover {
      background: var(--primary-hover);
    }
    
    .decrypt-error {
      color: #ef4444;
      margin-top: 1rem;
      height: 1.5rem;
      font-size: 0.9rem;
    }
    
    /* Scroll Progress Bar */
    .progress-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: transparent;
      z-index: 1000;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      width: 0%;
      transition: width 0.1s ease;
    }
    
    /* Floating Scroll Buttons */
    .scroll-buttons {
      position: fixed;
      right: 1.5rem;
      bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 999;
    }
    
    .scroll-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border: none;
      transition: all 0.2s ease;
    }
    
    .scroll-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }
      
      h1 {
        font-size: 2rem;
      }
      
      .student-list {
        grid-template-columns: 1fr;
      }
      
      .modal-content {
        width: 95%;
        padding: 1.5rem;
      }
      
      .modal-info {
        grid-template-columns: 1fr;
      }
      
      .student-info strong {
        min-width: 100px;
      }
      
      .pagination {
        gap: 0.3rem;
      }
      
      .page-numbers {
        flex-wrap: wrap;
        justify-content: center;
      }
      
      .scroll-buttons {
        right: 1rem;
        bottom: 1rem;
      }
      
      .keypad {
        width: 220px;
      }
      
      .pin-display {
        width: 180px;
        height: 50px;
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="scroll-buttons">
    <button class="scroll-btn" id="scrollToTopBtn"><i class="fas fa-arrow-up"></i></button>
    <button class="scroll-btn" id="scrollToBottomBtn"><i class="fas fa-arrow-down"></i></button>
  </div>

  <div class="lock-overlay" id="lockOverlay">
    <h2 class="lock-title">Enter PIN to Access</h2>
    <div class="pin-display" id="pinDisplay">••••</div>
    <div class="keypad">
      <button onclick="appendPin(1)">1</button>
      <button onclick="appendPin(2)">2</button>
      <button onclick="appendPin(3)">3</button>
      <button onclick="appendPin(4)">4</button>
      <button onclick="appendPin(5)">5</button>
      <button onclick="appendPin(6)">6</button>
      <button onclick="appendPin(7)">7</button>
      <button onclick="appendPin(8)">8</button>
      <button onclick="appendPin(9)">9</button>
      
       <button class="clear" onclick="clearPin()">Clear</button>
      <button onclick="appendPin(0)">0</button>
      <button class="enter" onclick="checkPin()">Enter</button>
    </div>
    <div class="error-message" id="errorMessage"></div>
  </div>

  <div class="decrypt-modal" id="decryptModal">
    <div class="decrypt-content">
      <h3>🔐 Enter Data Decryption Password</h3>
      <input type="password" class="decrypt-input" id="decryptPassword" placeholder="Enter decryption password">
      <button class="decrypt-btn" onclick="decryptData()">Decrypt Data</button>
      <div class="decrypt-error" id="decryptError"></div>
    </div>
  </div>

  <div class="container" id="mainContent" style="display: none;">
    <header>
      <h1>StudentSniffer</h1>
      <div class="creator">created by mahendraplus.github.io</div>
      <div class="search-container">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="search" placeholder="Search students by name, department, etc..." />
      </div>
    </header>
    
    <div class="student-list" id="studentList">
      <div class="loading">
        <div class="spinner"></div>
      </div>
    </div>
    
    <div class="pagination" id="pagination">
      <button id="prevBtn" disabled><i class="fas fa-chevron-left"></i> Previous</button>
      <div class="page-numbers" id="pageNumbers"></div>
      <button id="nextBtn">Next <i class="fas fa-chevron-right"></i></button>
    </div>
  </div>

  <div class="modal" id="photoModal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal('photoModal')">&times;</button>
      <div class="modal-photo-container">
        <img id="modalPhoto" class="modal-photo" src="" alt="Student Photo">
      </div>
    </div>
  </div>

  <div class="modal" id="detailsModal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal('detailsModal')">&times;</button>
      <div id="modalDetailsContent"></div>
    </div>
  </div>

  <script>
    // State management
    const state = {
      students: [],
      filteredData: [],
      currentPage: 1,
      perPage: 20,
      totalPages: 1,
      enteredPin: "",
      CORRECT_PIN: "2525"
    };

    // DOM elements
    const elements = {
      container: document.getElementById('studentList'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      pageNumbers: document.getElementById('pageNumbers'),
      mainContent: document.getElementById('mainContent'),
      lockOverlay: document.getElementById('lockOverlay'),
      pinDisplay: document.getElementById('pinDisplay'),
      errorMessage: document.getElementById('errorMessage'),
      decryptModal: document.getElementById('decryptModal'),
      decryptPassword: document.getElementById('decryptPassword'),
      decryptError: document.getElementById('decryptError'),
      search: document.getElementById('search'),
      scrollToTopBtn: document.getElementById('scrollToTopBtn'),
      scrollToBottomBtn: document.getElementById('scrollToBottomBtn'),
      progressBar: document.getElementById('progressBar')
    };

    // Field configurations
    const fields = {
      excluded: [
        'Access Token', 'Login Message', 'photoPath', 'photo', 'id', 'studentId'
      ],
      primary: [
        'Student Full Name', 'Phone Student1', 'Student Display No', 
        'Enrollment No', 'Student Institute Code', 'Institute Name',
        'Institute Short Name', 'University Name', 'Course Name',
        'Program Name', 'Department Name', 'Current Semester',
        'Current Roll No', 'Current Batch', 'Current Division',
        'Email', 'Email Alternate', 'Gender', 'Birth Date'
      ]
    };

    // Initialize the app
    function init() {
      setupEventListeners();
    }

    // PIN functions
    function appendPin(num) {
      if (state.enteredPin.length < 4) {
        state.enteredPin += num;
        updatePinDisplay();
      }
    }

    function clearPin() {
      state.enteredPin = "";
      updatePinDisplay();
      elements.errorMessage.textContent = "";
    }

    function updatePinDisplay() {
      const display = state.enteredPin.split('').map(() => '•').join('');
      elements.pinDisplay.textContent = display || '••••';
    }

    function checkPin() {
      if (state.enteredPin === state.CORRECT_PIN) {
        elements.lockOverlay.style.display = "none";
        elements.decryptModal.style.display = "flex";
      } else {
        elements.errorMessage.textContent = "Incorrect PIN. Try again.";
        state.enteredPin = "";
        updatePinDisplay();
      }
    }

    // Data decryption
    async function decryptData() {
      const password = elements.decryptPassword.value;
      if (!password) {
        elements.decryptError.textContent = "Please enter a password";
        return;
      }

      try {
        const buf = await fetch('db.json.enc').then(r => r.arrayBuffer());
        const salt = buf.slice(0, 16);
        const iv = buf.slice(16, 28);
        const tag = buf.slice(28, 44);
        const enc = buf.slice(44);
        
        const keyMat = await crypto.subtle.importKey(
          "raw", 
          new TextEncoder().encode(password), 
          "PBKDF2", 
          false, 
          ["deriveKey"]
        );
        
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: 1e5, hash: "SHA-256" },
          keyMat,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        const ct = new Uint8Array([...new Uint8Array(enc), ...new Uint8Array(tag)]);
        const dec = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv, tagLength: 128 }, 
          key, 
          ct
        );

        const decryptedData = JSON.parse(new TextDecoder().decode(dec));
        elements.decryptModal.style.display = "none";
        elements.mainContent.style.display = "block";
        initializeApp(decryptedData);
      } catch (error) {
        console.error("Decryption error:", error);
        elements.decryptError.textContent = "❌ Wrong password or corrupted file";
      }
    }

    // App initialization
    function initializeApp(data) {
      state.students = data.map(student => {
        const formattedStudent = {};
        Object.entries(student).forEach(([key, value]) => {
          const formattedKey = formatKey(key);
          if (!fields.excluded.includes(formattedKey)) {
            formattedStudent[formattedKey] = value;
          }
        });
        return formattedStudent;
      });

      state.filteredData = [...state.students];
      state.totalPages = Math.ceil(state.filteredData.length / state.perPage);
      renderPage(1);
      setupPagination();
    }

    // Utility functions
    function formatKey(key) {
      return key
        .replace(/([A-Z])/g, ' $1')
        .replace(/^./, str => str.toUpperCase())
        .replace(/Url|Link/gi, '')
        .trim();
    }

    function whatsappMessage(name) {
      return `👋 Hello ${name},
Just came across this clean and impressive portfolio thought you might like it 👇
🔗 https://mahendraplus.github.io

💻 Real projects, smart tools, and smooth design
✨ Simple. Sharp. Worth a look.

And if you ever need any help with cyber or tech stuff, feel free to message me.
— Max 👨‍💻`;
    }

    // Rendering functions
    function renderPage(page) {
      state.currentPage = page;
      const start = (page - 1) * state.perPage;
      const end = start + state.perPage;
      const batch = state.filteredData.slice(start, end);

      elements.container.innerHTML = '';

      if (batch.length === 0) {
        elements.container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-user-slash"></i>
            <p>No students found matching your search.</p>
          </div>
        `;
        return;
      }

      const fragment = document.createDocumentFragment();
      batch.forEach(student => {
        fragment.appendChild(renderStudentCard(student));
      });

      elements.container.appendChild(fragment);
      updatePaginationControls();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderStudentCard(student) {
      const card = document.createElement('div');
      card.className = 'student-card';

      const studentName = student['Student Full Name'] || 'Unknown';
      const studentPhone = student['Phone Student1'] || 'Not available';

      const primaryInfo = Object.entries(student)
        .filter(([key]) => fields.primary.includes(key))
        .sort(([keyA], [keyB]) => fields.primary.indexOf(keyA) - fields.primary.indexOf(keyB))
        .slice(0, 6);

      const basicInfo = primaryInfo.map(([k, v]) => `
        <p><strong>${k}:</strong> <span>${v}</span></p>
      `).join('');

      const buttons = Object.entries(student)
        .filter(([k, v]) => typeof v === 'string' && v.startsWith('http'))
        .map(([k, v]) => `
          <a href="${v}" target="_blank" rel="noopener noreferrer">
            <i class="fas ${k.includes('linkedin') ? 'fa-linkedin' : k.includes('github') ? 'fa-github' : 'fa-external-link-alt'}"></i>
            ${k.replace(/URL|url|Link/gi, '')}
          </a>
        `).join('');

      const whatsappButton = studentPhone && studentPhone !== 'Not available' ? `
        <a href="https://wa.me/${studentPhone.replace(/\D/g, '')}?text=${encodeURIComponent(whatsappMessage(studentName))}" 
           class="whatsapp-btn" target="_blank">
          <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
      ` : '';

      const photoFields = ['Photo Path', 'Photo', 'Student Photo', 'Image'];
      let photoPath = '';
      for (const field of photoFields) {
        if (student[field]) {
          photoPath = student[field];
          break;
        }
      }

      const imageHTML = photoPath && photoPath.trim() !== ''
        ? `<img src="${photoPath}" class="student-pic" onerror="handleImageError(this)" onclick="showPhotoModal('${photoPath}')">`
        : `<div class="no-photo" onclick="handleImageError(this)"><i class="fas fa-user"></i></div>`;

      card.innerHTML = `
        <div class="student-content">
          <div class="student-pic-wrapper">${imageHTML}</div>
          <h3 class="student-name">${studentName}</h3>
          <div class="student-phone">
            <i class="fas fa-phone"></i> ${studentPhone}
          </div>
          <div class="student-info">${basicInfo}</div>
          <div class="student-buttons">
            ${whatsappButton}
            ${buttons}
            <button class="show-more" onclick="showDetailsModal(${JSON.stringify(student).replace(/"/g, '&quot;')})">
              <i class="fas fa-info-circle"></i> Full Details
            </button>
          </div>
        </div>
      `;

      return card;
    }

    // Pagination functions
    function setupPagination() {
      elements.prevBtn.addEventListener('click', () => {
        if (state.currentPage > 1) {
          renderPage(state.currentPage - 1);
        }
      });

      elements.nextBtn.addEventListener('click', () => {
        if (state.currentPage < state.totalPages) {
          renderPage(state.currentPage + 1);
        }
      });

      updatePaginationControls();
    }

    function updatePaginationControls() {
      elements.prevBtn.disabled = state.currentPage === 1;
      elements.nextBtn.disabled = state.currentPage === state.totalPages;

      elements.pageNumbers.innerHTML = '';
      
      addPageNumber(1);
      
      if (state.currentPage > 3) {
        const ellipsis = document.createElement('span');
        ellipsis.textContent = '...';
        elements.pageNumbers.appendChild(ellipsis);
      }
      
      const start = Math.max(2, state.currentPage - 1);
      const end = Math.min(state.totalPages - 1, state.currentPage + 1);
      
      for (let i = start; i <= end; i++) {
        addPageNumber(i);
      }
      
      if (state.currentPage < state.totalPages - 2) {
        const ellipsis = document.createElement('span');
        ellipsis.textContent = '...';
        elements.pageNumbers.appendChild(ellipsis);
      }
      
      if (state.totalPages > 1) {
        addPageNumber(state.totalPages);
      }
    }

    function addPageNumber(pageNum) {
      const pageBtn = document.createElement('button');
      pageBtn.textContent = pageNum;
      if (pageNum === state.currentPage) {
        pageBtn.classList.add('active');
      }
      pageBtn.addEventListener('click', () => {
        renderPage(pageNum);
      });
      elements.pageNumbers.appendChild(pageBtn);
    }

    // Modal functions
    function showPhotoModal(photoUrl) {
      const modal = document.getElementById('photoModal');
      const modalImg = document.getElementById('modalPhoto');
      modalImg.src = photoUrl;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function showDetailsModal(student) {
      const modal = document.getElementById('detailsModal');
      const modalContent = document.getElementById('modalDetailsContent');
      
      const studentInfo = Object.entries(student).filter(([k, v]) => 
        !k.match(/url|link/i) && v !== '' && v !== null
      );

      const studentName = student['Student Full Name'] || 'Unknown';
      const studentPhone = student['Phone Student1'] || 'Not available';

      const photoFields = ['Photo Path', 'Photo', 'Student Photo', 'Image'];
      let photoPath = '';
      for (const field of photoFields) {
        if (student[field]) {
          photoPath = student[field];
          break;
        }
      }

      const photoSection = photoPath && photoPath.trim() !== ''
        ? `<div class="modal-photo-container" onclick="showPhotoModal('${photoPath}')">
            <img src="${photoPath}" class="modal-photo" onerror="this.onerror=null;this.parentNode.innerHTML='<div class=\\'no-photo\\'><i class=\\'fas fa-user\\'></i></div>'">
          </div>`
        : '';

      const sortedInfo = [...studentInfo].sort(([keyA], [keyB]) => {
        const indexA = fields.primary.indexOf(keyA);
        const indexB = fields.primary.indexOf(keyB);
        if (indexA !== -1 && indexB !== -1) return indexA - indexB;
        if (indexA !== -1) return -1;
        if (indexB !== -1) return 1;
        return keyA.localeCompare(keyB);
      });

      const infoSections = sortedInfo.map(([k, v]) => `
        <p><strong>${k}:</strong> ${v}</p>
      `).join('');

      const whatsappButton = studentPhone && studentPhone !== 'Not available' ? `
        <div style="margin-top: 1rem;">
          <a href="https://wa.me/${studentPhone.replace(/\D/g, '')}?text=${encodeURIComponent(whatsappMessage(studentName))}" 
             class="whatsapp-btn" target="_blank" style="display: inline-block; padding: 0.75rem 1.5rem; font-size: 1rem;">
            <i class="fab fa-whatsapp"></i> Send WhatsApp Message
          </a>
        </div>
      ` : '';

      modalContent.innerHTML = `
        ${photoSection}
        <div class="modal-info">${infoSections}</div>
        ${whatsappButton}
      `;
      
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    function handleImageError(img) {
      if (img.tagName === 'IMG') {
        img.onerror = null;
        img.parentNode.innerHTML = '<div class="no-photo"><i class="fas fa-user"></i></div>';
      }
    }

    // Event listeners
    function setupEventListeners() {
      // Search functionality
      elements.search.addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase().trim();
        state.filteredData = state.students.filter(student => 
          Object.values(student).some(
            v => typeof v === 'string' && v.toLowerCase().includes(val) ||
                 typeof v === 'number' && v.toString().includes(val)
          )
        );
        state.totalPages = Math.ceil(state.filteredData.length / state.perPage);
        renderPage(1);
      });

      // Scroll buttons
      elements.scrollToTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      elements.scrollToBottomBtn.addEventListener('click', () => {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      });

      // Scroll progress bar
      window.addEventListener('scroll', () => {
        const scrollTotal = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrollPosition = window.scrollY;
        const scrollPercentage = (scrollPosition / scrollTotal) * 100;
        elements.progressBar.style.width = scrollPercentage + '%';
      });

      // Handle Enter key in decrypt password field
      elements.decryptPassword.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          decryptData();
        }
      });

      // Close modals when clicking outside content
      document.querySelectorAll('.modal').forEach(modal => {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) {
            closeModal(modal.id);
          }
        });
      });
    }

    // Global functions
    window.appendPin = appendPin;
    window.clearPin = clearPin;
    window.checkPin = checkPin;
    window.decryptData = decryptData;
    window.showPhotoModal = showPhotoModal;
    window.showDetailsModal = showDetailsModal;
    window.closeModal = closeModal;
    window.handleImageError = handleImageError;

    // Initialize the app
    init();
  </script>
</body>
</html>
